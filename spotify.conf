#!name = Spotify 去广告
#!desc = 屏蔽 Spotify 免费版的音频/横幅广告接口（ad-*、pendragon、aet.spotify.com 等），需开启 HTTPS MitM并信任根证书。仅广告拦截，不含会员解锁
#!author = Doubao
#!icon = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
#!tag = 去广告, Spotify
#!date = 2026-10-17

hostname = spclient.wg.spotify.com, *spclient.spotify.com

# 核心规则：拦截 ad- 开头广告接口与 pendragon广告推送，返回200空响应
^https:\/\/(?:\w+-spclient|spclient\.wg)\.spotify\.com(?::443)?\/(?:ad-|pendragon) url reject-200
# 备用广告接口（老版本客户端）
^https:\/\/gae2-spclient\.spotify\.com:443\/ad url reject
# 可选：屏蔽设置页升级会员推广入口，取消注释启用
# ^https:\/\/.*-spclient\.spotify\.com(?::443)?\/pam-view-service\/ url reject

# 【可选追加】首页/搜索横幅广告拦截，取消注释启用
# ^https:\/\/(?:\w+-spclient|spclient\.wg)\.spotify\.com(?::443)?\/(browsita|casita|scrollsita)\/v.\/(browse|home\/default|scroll\/spotify) url reject-200
